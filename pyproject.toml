[project]
name = "uni-index"
version = "0.1.0"
description = "Canonical, versioned index of target university crawl targets"
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "PyYAML>=6.0",
]

[project.scripts]
uni-index = "uni_index.cli:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
